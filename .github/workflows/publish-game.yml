# Shared build for every Slop Box game. Each game's repo calls it with a short workflow:
#
#   jobs:
#     publish:
#       uses: slop-box/slopboxhub/.github/workflows/publish-game.yml@main
#       with:
#         id: <game id>
#       secrets: inherit
#
# It tests the game (optional), publishes ghcr.io/slop-box/<id> as :latest, :sha-<short> and
# :sha-<full>, and with `deploy: true` asks the server to update that one game right away.
#
# Org secrets used by the deploy step (set once in the org's Actions secrets):
#   SLOPBOX_DEPLOY_URL    https://<domain>/deploy
#   SLOPBOX_DEPLOY_TOKEN  same value as in the server's .env
# Until both exist (PLAN.md Step 11), a deploy request just prints a warning.

name: Publish Slop Box game

on:
  workflow_call:
    inputs:
      id:
        description: Game id (lowercase letters, digits, hyphens). Also the image name and subdomain.
        type: string
        required: true
      test-command:
        description: Shell command that must pass before publishing, e.g. "npm ci && npm test". Empty skips tests.
        type: string
        default: ""
      dockerfile:
        description: Path to the Dockerfile, relative to the repo root (the build context).
        type: string
        default: Dockerfile
      node-version:
        description: Node version for the test step.
        type: string
        default: "22"
      deploy:
        description: Update the game on the server right after publishing.
        type: boolean
        default: false
    secrets:
      SLOPBOX_DEPLOY_URL:
        required: false
      SLOPBOX_DEPLOY_TOKEN:
        required: false

jobs:
  test:
    if: inputs.test-command != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Run tests
        run: ${{ inputs.test-command }}

  publish:
    needs: test
    # Run when tests passed or were skipped, but not when they failed or were cancelled.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: true # a newer push replaces a build that's still running
    steps:
      - name: Check the game id
        env:
          ID: ${{ inputs.id }}
        run: |
          if ! printf '%s' "$ID" | grep -Eq '^[a-z0-9]+(-[a-z0-9]+)*$'; then
            echo "::error::Game id '$ID' must be lowercase letters, digits and single hyphens (see GAME_CONTRACT.md)."
            exit 1
          fi

      # The checkout includes .git, so a Dockerfile can read the commit (QuickPic does).
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/slop-box/${{ inputs.id }}
          # :latest is what the server runs. The sha tags let you roll back to a specific build.
          tags: |
            type=raw,value=latest
            type=sha
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - name: Update the game on the server
        env:
          ID: ${{ inputs.id }}
          DEPLOY_URL: ${{ secrets.SLOPBOX_DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.SLOPBOX_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$DEPLOY_TOKEN" ]; then
            echo "::warning::Deploy isn't set up yet (org secrets SLOPBOX_DEPLOY_URL and SLOPBOX_DEPLOY_TOKEN). The image is published; the server picks it up on Watchtower's next run."
            exit 0
          fi
          curl -fsS --max-time 300 -H "Authorization: Bearer $DEPLOY_TOKEN" "$DEPLOY_URL?id=$ID"
          echo "Deployed $ID."
