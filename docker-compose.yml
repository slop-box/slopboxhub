# Slop Box stack, run on Unraid with the Compose Manager plugin.
# Secrets and the domain come from .env next to this file (copy .env.example). Never commit .env.
#
# Rules for every game service (see GAME_CONTRACT.md):
#   - service name = game id = subdomain = image name. Caddy reaches the game at <id>:<port>.
#   - on the slopbox network, and NO `ports:`. Caddy must be the only way in, or the party
#     gate can be skipped from the home network.
#   - Watchtower enable label. The update-lock hook label is added in PLAN.md Step 11, once the
#     hub serves /update-allowed (adding it earlier would block every update).

name: slopboxhub   # matches the Compose Manager stack name, so containers are slopboxhub-<service>-1

networks:
  slopbox:
    name: slopbox   # fixed name so the existing Watchtower can join it (PLAN.md Step 11)

volumes:
  hub-data:         # party gate state (open/closed), so a hub restart doesn't close the games

services:
  # Cloudflare Tunnel connector for Slop Box's own tunnel. The tunnel's routes (set in the
  # Cloudflare dashboard) send <domain> and *.<domain> to http://caddy:80.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    networks: [slopbox]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    # No Watchtower label: a restart drops every connection, so update it by hand
    # (Compose Pull, then Compose Up) when nobody is playing.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    networks: [slopbox]
    # The only published port in the stack, for testing from the home network
    # (curl -H "Host: <domain>" http://<unraid-ip>:8480). The tunnel reaches Caddy at caddy:80.
    # Everything goes through Caddy, so the party gate also applies on the home network.
    ports:
      - "${SLOPBOX_HTTP_PORT:-8480}:80"
    environment:
      SLOPBOX_DOMAIN: ${SLOPBOX_DOMAIN}
    volumes:
      # The folder, not the single file: git replaces files on pull, and a single-file mount would
      # keep showing the old copy. After pulling a Caddyfile change, reload Caddy (see README).
      - ./proxy:/etc/caddy:ro
      - /mnt/user/appdata/slopbox/caddy:/data
    # No Watchtower label: update Caddy by hand (Compose Pull, then Compose Up) when nothing is running.

  # Landing page at <domain>. Later also the party gate and the deploy route (PLAN.md Steps 8 and 11).
  hub:
    image: ghcr.io/slop-box/hub:latest
    restart: unless-stopped
    networks: [slopbox]
    environment:
      # Read games.json from the cloned repo, so `git pull` updates the list without a new image.
      GAMES_FILE: /srv/repo/games.json
      SLOPBOX_DOMAIN: ${SLOPBOX_DOMAIN}
      SLOPBOX_ADMIN_PASSWORD: ${SLOPBOX_ADMIN_PASSWORD}
      SLOPBOX_GATE_SECRET: ${SLOPBOX_GATE_SECRET}
      GATE_OPEN_HOURS: ${GATE_OPEN_HOURS:-4}
      GATE_GRACE_MINUTES: ${GATE_GRACE_MINUTES:-60}
    volumes:
      - ./:/srv/repo:ro
      # Named volume (not an appdata folder) so it starts out writable by the hub's non-root user.
      - hub-data:/app/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    mem_limit: 256m
    cpus: 0.5

  quickpic:
    image: ghcr.io/slop-box/quickpic:latest
    restart: unless-stopped
    networks: [slopbox]
    environment:
      ADMIN_PASSWORD: ${QUICKPIC_ADMIN_PASSWORD:-}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    mem_limit: 512m
    cpus: 1.0

  # DebateBros joins once it moves to the slop-box org (PLAN.md Step 1).
