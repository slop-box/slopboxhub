<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">

<title>Slop Box</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
