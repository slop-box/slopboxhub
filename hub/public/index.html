<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slop Box</title>
<!-- Placeholder landing page, served by Caddy straight from the repo. PLAN.md Step 7 replaces it
     with the hub container (landing page + party gate). -->
<style>
  :root { --bg: #15121c; --card: #221d2e; --text: #f3eefc; --muted: #a99fbf; --accent: #ffcf33; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.4 system-ui, sans-serif; padding: 24px 16px; }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 2.5rem; margin: 0 0 4px; color: var(--accent); }
  p.sub { margin: 0 0 24px; color: var(--muted); }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  li { background: var(--card); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  h2 { margin: 0; font-size: 1.4rem; }
  .meta { color: var(--muted); font-size: 0.9rem; }
  .links { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; }
  a { flex: 1; text-align: center; padding: 10px; border-radius: 8px; background: var(--accent); color: #1a1500; font-weight: 600; text-decoration: none; }
  a.tv { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
  a:focus-visible { outline: 4px solid var(--text); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Slop Box</h1>
  <p class="sub">Open a game's TV page on the TV, then scan its QR code with your phone.</p>
  <ul id="games"><li>Loading games…</li></ul>
</main>
<script>
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const gameUrl = id => location.protocol + '//' + id + '.' + location.host;
  fetch('/games.json').then(r => r.json()).then(games => {
    document.getElementById('games').innerHTML = games.map(g => `
      <li>
        <h2>${esc(g.name)}</h2>
        <div class="meta">${esc(g.players)} players${g.needsTv ? ' · needs a TV' : ''}${(g.extraDevices || []).map(d => ' · ' + esc(d)).join('')}</div>
        <div>${esc(g.blurb)}</div>
        <div class="links">
          <a href="${gameUrl(g.id)}/">Play</a>
          ${g.needsTv ? `<a class="tv" href="${gameUrl(g.id)}/tv">TV</a>` : ''}
        </div>
      </li>`).join('');
  }).catch(() => { document.getElementById('games').innerHTML = '<li>Couldn’t load the game list.</li>'; });
</script>
</body>
</html>
